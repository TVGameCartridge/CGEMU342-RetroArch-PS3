name: Build PS3 HEN test PKG

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-ps3-test-pkg.yml'
      - 'scripts/**'
      - 'compat/**'
  workflow_dispatch:
    inputs:
      mapper301_mode:
        description: "Mapper 301 hardware implementation"
        type: choice
        required: true
        default: "8157"
        options:
          - "8157"
          - "upstream"

permissions:
  contents: read

jobs:
  ps3_hen_pkg:
    name: Build separate PSL1GHT test application
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout CGEMU342 PS3 project
        uses: actions/checkout@v4

      - name: Fetch upstream FCEUmm and RetroArch
        shell: bash
        run: |
          git clone --depth 1 --branch master https://github.com/libretro/libretro-fceumm.git upstream-fceumm
          git clone --depth 1 --branch master https://github.com/libretro/RetroArch.git upstream-retroarch
          git clone --depth 1 --branch master https://github.com/libretro/libretro-core-info.git upstream-core-info
          {
            echo "FCEUmm: $(git -C upstream-fceumm rev-parse HEAD)"
            echo "RetroArch: $(git -C upstream-retroarch rev-parse HEAD)"
            echo "Core info: $(git -C upstream-core-info rev-parse HEAD)"
            echo "Mapper301: ${{ inputs.mapper301_mode || '8157' }}"
            echo "Target: separate PSL1GHT PS3 test app, not a patched PSX-Place CE Beta4 package."
          } > BUILD-INFO.txt

      - name: Select FCEUmm mapper support
        shell: bash
        env:
          MAPPER301_MODE: ${{ inputs.mapper301_mode || '8157' }}
        run: python3 scripts/prepare_fceumm.py upstream-fceumm --mapper301 "$MAPPER301_MODE"

      - name: Integrate CGEMU342 embedded ROM selection and test directory
        shell: bash
        run: |
          cc -std=c99 -Wall -Wextra -Werror -O2 \
            tests/test_cg342_container.c -o /tmp/test_cg342_container
          /tmp/test_cg342_container
          python3 scripts/apply_cg342_fceumm.py upstream-fceumm
          grep -q 'cg342_frame_end();' upstream-fceumm/src/drivers/libretro/libretro.c
          grep -q 'cg342_return_to_menu()' upstream-fceumm/src/drivers/libretro/libretro.c

      - name: Add NES core metadata for content browsing
        shell: bash
        run: |
          test -s upstream-core-info/fceumm_libretro.info
          mkdir -p upstream-retroarch/pkg/psl1ght/pkg/USRDIR/info
          # The bundled PS3 executable is CORE.SELF; RetroArch looks up
          # its metadata by basename, therefore the file must be CORE.info.
          cp upstream-core-info/fceumm_libretro.info \
            upstream-retroarch/pkg/psl1ght/pkg/USRDIR/info/CORE.info
          grep -Eq '^supported_extensions = ".*nes' \
            upstream-retroarch/pkg/psl1ght/pkg/USRDIR/info/CORE.info
          echo "FCEUmm CORE.info installed for .nes content detection." >> BUILD-INFO.txt

      - name: Compile core and package PS3 test app
        shell: bash
        run: |
          docker run --rm --user root \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            reallibretroretroarch/libretro-build-psl1ght:latest \
            bash -euc '
              cd /work/upstream-fceumm
              make -f Makefile.libretro -j2 \
                platform=psl1ght HAVE_HDPACK=0 HAVE_NTSC=0
              test -s fceumm_libretro_psl1ght.a
              cd /work/upstream-retroarch
              cp ../upstream-fceumm/fceumm_libretro_psl1ght.a libretro_psl1ght.a
              make -f Makefile.psl1ght -j2 create-core
              make -f Makefile.psl1ght.salamander -j2 pkg
              test -s retroarch_psl1ght.pkg
            '

      - name: Verify package and document limitations
        shell: bash
        run: |
          test -s upstream-retroarch/retroarch_psl1ght.pkg
          test -s upstream-retroarch/pkg/psl1ght/pkg/USRDIR/info/CORE.info
          ls -lh upstream-retroarch/retroarch_psl1ght.pkg
          cat >> BUILD-INFO.txt <<'EOF'
          This test package is based on upstream RetroArch PSL1GHT, not PSX-Place CE Beta 4.
          Upstream PSL1GHT default app ID is SSNE10001; CE uses SSNE10000.
          This includes CORE.info metadata for manual .nes browsing.
          v3 adds CGEMU342 embedded ROM handling and the RAM 07F2=A5 selection signal.
          Synthetic parser tests and compilation are not real hardware validation.
          Import Content playlists need additional databases and are not guaranteed.
          Try Load Content > /dev_usb000/ > ROM.nes (or /dev_hdd0/).
          This is an untested homebrew build. Back up saves/configuration.
          Do not install if you need to retain an existing SSNE10001 app.
          EOF

      - name: Upload test PKG (hardware testing needed)
        uses: actions/upload-artifact@v4
        with:
          name: PS3-HEN-FCEUmm-CG342-Test-PKG-v3-${{ inputs.mapper301_mode || '8157' }}
          path: |
            upstream-retroarch/retroarch_psl1ght.pkg
            BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
