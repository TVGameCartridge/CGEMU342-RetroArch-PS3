name: Build PS3 HEN test PKG

on:
  workflow_dispatch:
    inputs:
      mapper301_mode:
        description: "Mapper 301 hardware implementation"
        type: choice
        required: true
        default: "8157"
        options:
          - "8157"
          - "upstream"

permissions:
  contents: read

jobs:
  ps3_hen_pkg:
    name: Build separate PSL1GHT test application
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout CGEMU342 PS3 project
        uses: actions/checkout@v4

      - name: Fetch upstream FCEUmm and RetroArch
        shell: bash
        run: |
          git clone --depth 1 --branch master https://github.com/libretro/libretro-fceumm.git upstream-fceumm
          git clone --depth 1 --branch master https://github.com/libretro/RetroArch.git upstream-retroarch
          {
            echo "FCEUmm: $(git -C upstream-fceumm rev-parse HEAD)"
            echo "RetroArch: $(git -C upstream-retroarch rev-parse HEAD)"
            echo "Mapper301: ${{ inputs.mapper301_mode || '8157' }}"
            echo "Target: separate PSL1GHT PS3 test app, not a patched PSX-Place CE Beta4 package."
          } > BUILD-INFO.txt

      - name: Select FCEUmm mapper support
        shell: bash
        env:
          MAPPER301_MODE: ${{ inputs.mapper301_mode || '8157' }}
        run: python3 scripts/prepare_fceumm.py upstream-fceumm --mapper301 "$MAPPER301_MODE"

      - name: Compile core and package PS3 test app
        shell: bash
        run: |
          docker run --rm --user root \
            -v "$GITHUB_WORKSPACE:/work" \
            -w /work \
            reallibretroretroarch/libretro-build-psl1ght:latest \
            bash -euc '
              cd /work/upstream-fceumm
              make -f Makefile.libretro -j2 \
                platform=psl1ght HAVE_HDPACK=0 HAVE_NTSC=0
              test -s fceumm_libretro_psl1ght.a
              cd /work/upstream-retroarch
              cp ../upstream-fceumm/fceumm_libretro_psl1ght.a libretro_psl1ght.a
              make -f Makefile.psl1ght -j2 create-core
              make -f Makefile.psl1ght.salamander -j2 pkg
              test -s retroarch_psl1ght.pkg
            '

      - name: Verify package and document limitations
        shell: bash
        run: |
          test -s upstream-retroarch/retroarch_psl1ght.pkg
          ls -lh upstream-retroarch/retroarch_psl1ght.pkg
          cat >> BUILD-INFO.txt <<'EOF'
          This test package is based on upstream RetroArch PSL1GHT, not PSX-Place CE Beta 4.
          Upstream PSL1GHT default app ID is SSNE10001; CE uses SSNE10000.
          This is an untested homebrew build. Back up saves/configuration.
          Do not install if you need to retain an existing SSNE10001 app.
          EOF

      - name: Upload test PKG (hardware testing needed)
        uses: actions/upload-artifact@v4
        with:
          name: PS3-HEN-FCEUmm-Test-PKG-${{ inputs.mapper301_mode || '8157' }}
          path: |
            upstream-retroarch/retroarch_psl1ght.pkg
            BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 14
